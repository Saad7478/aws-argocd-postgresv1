apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-certs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/Saad7478/aws-argocd-postgresv1.git
    targetRevision: HEAD
    path: gitops/apps/postgres-certs
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
