apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"

spec:
  project: default

  source:
    repoURL: https://github.com/Saad7478/aws-argocd-postgresv1.git
    targetRevision: main
    path: gitops/apps/postgres
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        - .spec.backup.barmanObjectStore.data.immediateCheckpoint
        - .spec.managed.services.additional[].serviceTemplate.metadata.namespace
        - .spec.monitoring.customQueriesConfigMap[]
          | select(.name=="cnpg-default-monitoring")      